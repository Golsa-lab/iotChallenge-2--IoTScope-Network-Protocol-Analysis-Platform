<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#FBF6F7"/><stop offset="1" stop-color="#F3E3E7"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#000" stroke-opacity="0.035"/></pattern>
    <style>.r{font-family:Menlo,Consolas,monospace;font-size:12px;fill:#1A1A1D;fill-opacity:.7}.hl{fill:#8C1C3A;fill-opacity:1}</style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)" stroke="#EAD0D6" stroke-width="2"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <!-- packet list motif -->
  <g transform="translate(660,58)">
    <rect x="0" y="0" width="490" height="206" rx="10" fill="#FFFFFF" stroke="#EAD0D6" stroke-width="1.5"/>
    <rect x="0" y="0" width="490" height="30" rx="10" fill="#5E1224"/>
    <rect x="0" y="20" width="490" height="10" fill="#5E1224"/>
    <text x="14" y="20" font-family="Menlo, Consolas, monospace" font-size="12" fill="#FFFFFF">coap || mqtt || mqttsn</text>
    <text class="r" x="14" y="54">CoAP   CON  POST    /dining_room/temperature</text>
    <text class="r" x="14" y="78">CoAP   NON  DELETE  /validate   → 2.02</text>
    <rect x="6" y="88" width="478" height="22" rx="4" fill="#F3E3E7"/>
    <text class="r hl" x="14" y="103">MQTT   SUB  university/#        ← will match</text>
    <text class="r" x="14" y="128">MQTT   PUB  hospital/facility3/area3</text>
    <text class="r" x="14" y="152">MQTT-SN PUB QoS −1  → :1885</text>
    <text class="r" x="14" y="176">CoAP   CON  2.05  observe #10  (no ACK)</text>
    <text class="r" x="14" y="198" style="fill-opacity:.35">…</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="60" y="124" font-size="58" fill="#1A1A1D" letter-spacing="1">IoTScope</text>
    <text x="62" y="166" font-size="22" font-style="italic" fill="#8C1C3A">CoAP, MQTT &amp; MQTT-SN, read from raw captures</text>
  </g>
  <rect x="62" y="196" width="64" height="3" fill="#8C1C3A"/>
  <text x="62" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1D" fill-opacity=".6" letter-spacing="1.4">WIRESHARK · TSHARK · PYTHON · PCAPNG</text>
  <text x="62" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1A1A1D" fill-opacity=".6" letter-spacing="1.4">IOT CHALLENGE #2 · POLITECNICO DI MILANO</text>
</svg>
